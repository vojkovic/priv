instance_name = "privy"
motd = ""
listen = "::1"
port = 8888
timeout = 2.0

[limiter]
enabled = true
link_token = false
# IPs of the reverse proxies allowed to pass the client address in the X-Forwarded-For header
trusted_proxies = ["127.0.0.0/8", "::1"]

[engines]
# weight: how strongly its results rank, default: whether it starts on for users,
# inactive: disable the engine entirely

# general
google            = { weight = 1, default = true, inactive = false }
google_cse        = { weight = 1, default = true, inactive = false }
brave             = { weight = 1, default = true, inactive = false }
