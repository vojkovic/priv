instance_name = "priv"
motd = ""
listen = "::1"
port = 8888
timeout = 2.0

[limiter]
enabled = true
link_token = false
# IPs of the reverse proxies allowed to pass the client address in the X-Forwarded-For header
trusted_proxies = ["127.0.0.0/8", "::1"]

[engines]
# 0: off, not offered at all
# 1: offered, but switched off until a user turns it on
# 2: on (by default)

